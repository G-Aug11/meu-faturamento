<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Histórico · Meu Faturamento</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar__logo-wrap" title="Clique para trocar logo">
      <div id="logo-placeholder" style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <span style="font-size:38px;">💈</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);text-align:center;line-height:1.3;">Rick Barber<br>Original</span>
      </div>
      <div class="logo-overlay">📷<br>Trocar logo</div>
      <input type="file" id="input-logo" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;"/>
    </div>
    <nav class="sidebar__nav">
      <a href="index.html">    <span class="nav-icon">🏠</span><span class="nav-label">Atender</span></a>
      <a href="clientes.html"> <span class="nav-icon">👥</span><span class="nav-label">Clientes</span></a>
      <a href="historico.html"><span class="nav-icon">📋</span><span class="nav-label">Histórico</span></a>
      <a href="servicos.html"> <span class="nav-icon">✂️</span><span class="nav-label">Serviços</span></a>
      <a href="dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
    </nav>
    <button onclick="logout()" style="margin-top:auto;margin-bottom:8px;background:transparent;color:rgba(255,255,255,.35);font-family:Rajdhani,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 12px;cursor:pointer;transition:all .2s;" onmouseover="this.style.color='var(--gold-light)'" onmouseout="this.style.color='rgba(255,255,255,.35)'">🚪 Sair</button>
    <div class="sidebar__version">v3.0 Java · Rick Barber</div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">📋 Histórico</h1>
      <button class="btn btn-secondary" onclick="carregar()">↻ Atualizar</button>
    </div>
    <div class="filtros">
      <div class="form-group"><label>De</label><input type="date" id="filtro-inicio"/></div>
      <div class="form-group"><label>Até</label><input type="date" id="filtro-fim"/></div>
      <button class="btn btn-gold" id="btn-filtrar">🔍 Filtrar</button>
    </div>
    <div style="display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
      <div class="dash-card" style="min-width:160px;">
        <div class="dash-card__label">Total do período</div>
        <div class="dash-card__value green" id="total-periodo">—</div>
      </div>
      <div class="dash-card" style="min-width:160px;">
        <div class="dash-card__label">Atendimentos</div>
        <div class="dash-card__value" id="qtd-periodo">—</div>
      </div>
    </div>
    <div class="tabela-wrap">
      <table>
        <thead><tr><th>#</th><th>Data/Hora</th><th>Cliente</th><th>Serviços</th><th>Pagamento</th><th>Total</th><th>Del.</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text-light);">Selecione o período e clique em Filtrar.</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script>if(!sessionStorage.getItem("auth_token")){window.location.href="login.html";}</script>
<script>
var hoje = new Date().toISOString().slice(0,10);
document.getElementById('filtro-inicio').value = hoje.slice(0,8) + '01';
document.getElementById('filtro-fim').value = hoje;

async function carregar() {
  var inicio = document.getElementById('filtro-inicio').value;
  var fim = document.getElementById('filtro-fim').value;
  if (!inicio || !fim) { toast('Selecione as datas.', 'aviso'); return; }
  var data = await apiGet('/atendimentos', {inicio:inicio, fim:fim});
  document.getElementById('total-periodo').textContent = formatBRL(data.totalPeriodo || 0);
  document.getElementById('qtd-periodo').textContent = data.qtdAtendimentos || 0;
  var tbody = document.getElementById('tbody');
  var lista = data.atendimentos || [];
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text-light);">Nenhum atendimento neste período.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(function(a) {
    var svTags = (a.servicos || []).map(function(s){
      return '<span style="background:var(--bg);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;margin:2px;display:inline-block;">' + s.nome + '</span>';
    }).join('');
    var formaBadge = {
      dinheiro: '<span class="badge badge-dinheiro">💵 Dinheiro</span>',
      pix: '<span class="badge badge-pix">⚡ Pix</span>',
      cartao_debito: '<span class="badge badge-cartao">💳 Débito</span>',
      cartao_credito: '<span class="badge badge-cartao">💳 Crédito</span>'
    };
    return '<tr>' +
      '<td style="font-weight:600;color:var(--text-light);">#' + a.id + '</td>' +
      '<td style="white-space:nowrap;font-size:13px;">' + formatData(a.dataHora) + '</td>' +
      '<td><strong>' + a.nomeCliente + '</strong></td>' +
      '<td>' + svTags + '</td>' +
      '<td>' + (formaBadge[a.formaPagamento] || a.formaPagamento || '—') + '</td>' +
      '<td style="font-family:\'Rajdhani\',sans-serif;font-size:18px;font-weight:700;color:var(--green);">' + formatBRL(a.total) + '</td>' +
      '<td><button class="btn btn-danger btn-sm" onclick="excluir(' + a.id + ')">🗑</button></td>' +
    '</tr>';
  }).join('');
}

async function excluir(id) {
  if (!confirm('Remover o atendimento #' + id + '? Esta ação não pode ser desfeita.')) return;
  var r = await apiDelete('/atendimentos/' + id);
  toast(r.mensagem || r.erro || 'Erro', r.erro ? 'erro' : 'sucesso');
  carregar();
}

document.getElementById('btn-filtrar').addEventListener('click', carregar);
carregar();
</script>
</body>
</html>
