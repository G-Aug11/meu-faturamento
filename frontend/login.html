<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login · Meu Faturamento</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-wrapper { width:100%; max-width:420px; padding:24px; }
    .login-card { background:var(--card-bg); border-radius:16px; padding:40px 36px; box-shadow:var(--shadow-lg); border:1px solid var(--card-border); }
    .login-logo { display:flex; flex-direction:column; align-items:center; margin-bottom:32px; gap:8px; }
    .login-logo__icon { font-size:52px; }
    .login-logo__title { font-family:'Bebas Neue',cursive; font-size:28px; letter-spacing:3px; color:var(--sidebar-bg); }
    .login-logo__sub { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold); }
    .login-divider { height:2px; background:linear-gradient(to right, transparent, var(--gold), transparent); border-radius:2px; margin-bottom:28px; }
    .login-card .form-group { margin-bottom:18px; }
    .login-card .form-group label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); margin-bottom:6px; }
    .login-card .form-group input { width:100%; padding:12px 16px; border:1.5px solid var(--card-border); border-radius:8px; font-size:14px; background:#FDFBF8; transition:var(--trans); color:var(--text-dark); }
    .login-card .form-group input:focus { outline:none; border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(201,149,42,.12); }
    .btn-login { display:block; width:100%; padding:14px; background:var(--sidebar-bg); color:var(--gold-light); font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; border-radius:8px; border:1.5px solid var(--gold-dim); box-shadow:var(--shadow-md); transition:var(--trans); cursor:pointer; margin-top:24px; }
    .btn-login:hover:not(:disabled) { background:var(--gold); color:var(--sidebar-bg); border-color:var(--gold); transform:translateY(-2px); }
    .btn-login:disabled { opacity:.5; cursor:not-allowed; }
    .login-error { background:#FFF0F2; border:1px solid #F5C2C9; border-radius:8px; color:var(--red); font-size:13px; padding:10px 14px; margin-top:16px; display:none; text-align:center; }
    .login-error.show { display:block; }
    .login-footer { text-align:center; margin-top:20px; font-size:11px; color:var(--text-light); letter-spacing:.5px; }
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap');
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo__icon">💈</span>
        <span class="login-logo__title">Meu Faturamento</span>
        <span class="login-logo__sub">Rick Barber Original</span>
      </div>
      <div class="login-divider"></div>

      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário" autocomplete="username" autofocus/>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password"/>
      </div>

      <button class="btn-login" id="btn-login">🔑 Entrar</button>
      <div class="login-error" id="login-error">❌ Usuário ou senha incorretos.</div>
    </div>
    <div class="login-footer">v3.0 Java · Rick Barber</div>
  </div>

  <script>
    const API = 'http://localhost:8080/api';

    async function fazerLogin() {
      var usuario = document.getElementById('usuario').value.trim();
      var senha = document.getElementById('senha').value;
      var btn = document.getElementById('btn-login');
      var erro = document.getElementById('login-error');

      if (!usuario || !senha) {
        erro.textContent = '⚠️ Preencha usuário e senha.';
        erro.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando…';
      erro.classList.remove('show');

      try {
        var r = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuario, senha: senha })
        });

        var data = await r.json();

        if (r.ok && data.token) {
          sessionStorage.setItem('auth_token', data.token);
          sessionStorage.setItem('auth_usuario', data.usuario || usuario);
          window.location.href = 'index.html';
        } else {
          erro.textContent = '❌ ' + (data.erro || 'Usuário ou senha incorretos.');
          erro.classList.add('show');
        }
      } catch (e) {
        erro.textContent = '❌ Servidor não conectado. Inicie o Spring Boot.';
        erro.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = '🔑 Entrar';
      }
    }

    document.getElementById('btn-login').addEventListener('click', fazerLogin);
    document.getElementById('senha').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') fazerLogin();
    });
    document.getElementById('usuario').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('senha').focus();
    });

    // Redirecionar se já estiver logado
    if (sessionStorage.getItem('auth_token')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
