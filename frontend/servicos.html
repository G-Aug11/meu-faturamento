<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Serviços · Meu Faturamento</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar__logo-wrap" title="Clique para trocar logo">
      <div id="logo-placeholder" style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <span style="font-size:38px;">💈</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);text-align:center;line-height:1.3;">Rick Barber<br>Original</span>
      </div>
      <div class="logo-overlay">📷<br>Trocar logo</div>
      <input type="file" id="input-logo" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;"/>
    </div>
    <nav class="sidebar__nav">
      <a href="index.html">    <span class="nav-icon">🏠</span><span class="nav-label">Atender</span></a>
      <a href="clientes.html"> <span class="nav-icon">👥</span><span class="nav-label">Clientes</span></a>
      <a href="historico.html"><span class="nav-icon">📋</span><span class="nav-label">Histórico</span></a>
      <a href="servicos.html"> <span class="nav-icon">✂️</span><span class="nav-label">Serviços</span></a>
      <a href="dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
    </nav>
    <button onclick="logout()" style="margin-top:auto;margin-bottom:8px;background:transparent;color:rgba(255,255,255,.35);font-family:Rajdhani,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 12px;cursor:pointer;transition:all .2s;" onmouseover="this.style.color='var(--gold-light)'" onmouseout="this.style.color='rgba(255,255,255,.35)'">🚪 Sair</button>
    <div class="sidebar__version">v3.0 Java · Rick Barber</div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">✂️ Serviços</h1>
      <button class="btn btn-gold" id="btn-novo">+ Novo Serviço</button>
    </div>
    <div class="tabela-wrap">
      <table>
        <thead><tr><th style="width:60px;">Ícone</th><th>Nome</th><th>Preço</th><th style="width:160px;">Ações</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="4" style="text-align:center;padding:28px;color:var(--text-light);">Carregando…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-sv">
  <div class="modal">
    <div class="modal__title" id="modal-titulo">Novo Serviço</div>
    <input type="hidden" id="sv-id"/>
    <div class="form-group"><label>Nome *</label><input type="text" id="sv-nome" placeholder="Ex: Degradê, Progressiva…"/></div>
    <div class="form-group"><label>Preço (R$) *</label><input type="number" id="sv-preco" placeholder="0,00" step="0.50" min="0.50"/></div>
    <div class="form-group">
      <label>Ícone — Emoji selecionado: <span id="emoji-preview" style="font-size:20px;">✂️</span></label>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;">
      <button class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
      <button class="btn btn-gold" id="btn-salvar" style="flex:1;">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>if(!sessionStorage.getItem("auth_token")){window.location.href="login.html";}</script>
<script>
var emojiSelecionado = '✂️';

async function carregar() {
  var data = await apiGet('/servicos');
  var lista = Array.isArray(data) ? data : [];
  var tbody = document.getElementById('tbody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--text-light);">Nenhum serviço cadastrado.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(function(s) {
    return '<tr>' +
      '<td style="font-size:28px;">' + (s.icone || '✂️') + '</td>' +
      '<td><strong>' + s.nome + '</strong></td>' +
      '<td style="font-family:\'Rajdhani\',sans-serif;font-size:18px;font-weight:700;color:var(--gold);">' + formatBRL(s.preco) + '</td>' +
      '<td>' +
        '<button class="btn btn-secondary btn-sm" onclick="abrirEditar(' + s.id + ',\'' + s.nome.replace(/'/g,"\\'") + '\',\'' + (s.icone||'✂️') + '\',' + s.preco + ')">✏️ Editar</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="excluir(' + s.id + ')">🗑</button>' +
      '</td></tr>';
  }).join('');
}

function fecharModal() {
  document.getElementById('modal-sv').classList.remove('open');
  document.getElementById('sv-id').value = '';
  document.getElementById('sv-nome').value = '';
  document.getElementById('sv-preco').value = '';
}

function abrirEditar(id, nome, icone, preco) {
  document.getElementById('sv-id').value = id;
  document.getElementById('sv-nome').value = nome;
  document.getElementById('sv-preco').value = preco;
  emojiSelecionado = icone || '✂️';
  document.getElementById('emoji-preview').textContent = emojiSelecionado;
  montarEmojiGrid('emoji-grid', emojiSelecionado, function(e){ emojiSelecionado=e; document.getElementById('emoji-preview').textContent=e; });
  document.getElementById('modal-titulo').textContent = 'Editar Serviço';
  document.getElementById('modal-sv').classList.add('open');
}

async function excluir(id) {
  if (!confirm('Remover este serviço?')) return;
  var r = await apiDelete('/servicos/' + id);
  toast(r.mensagem || r.erro || 'Erro', r.erro ? 'erro' : 'sucesso');
  carregar();
}

document.getElementById('btn-novo').addEventListener('click', function() {
  emojiSelecionado = '✂️';
  document.getElementById('emoji-preview').textContent = '✂️';
  montarEmojiGrid('emoji-grid', '✂️', function(e){ emojiSelecionado=e; document.getElementById('emoji-preview').textContent=e; });
  document.getElementById('modal-titulo').textContent = 'Novo Serviço';
  document.getElementById('modal-sv').classList.add('open');
});
document.getElementById('btn-cancelar').addEventListener('click', fecharModal);
document.getElementById('modal-sv').addEventListener('click', function(e){ if(e.target===e.currentTarget) fecharModal(); });

document.getElementById('btn-salvar').addEventListener('click', async function() {
  var id = document.getElementById('sv-id').value;
  var nome = document.getElementById('sv-nome').value.trim();
  var preco = parseFloat(document.getElementById('sv-preco').value);
  if (!nome || !preco || preco <= 0) { toast('Nome e preço são obrigatórios.', 'erro'); return; }
  var body = { nome:nome, icone:emojiSelecionado, preco:preco };
  var r = id ? await apiPut('/servicos/' + id, body) : await apiPost('/servicos', body);
  toast(r.mensagem || r.erro || 'Erro', r.erro ? 'erro' : 'sucesso');
  if (!r.erro) { fecharModal(); carregar(); }
});

montarEmojiGrid('emoji-grid', '✂️', function(e){ emojiSelecionado=e; document.getElementById('emoji-preview').textContent=e; });
carregar();
</script>
</body>
</html>
