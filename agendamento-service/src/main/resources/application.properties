# Roda numa porta diferente do meu-faturamento (8080)
server.port=8081

# Mesmo MySQL do XAMPP, mas num banco separado (agendamento_db).
# createDatabaseIfNotExist=true cria o banco sozinho na primeira vez.
spring.datasource.url=jdbc:mysql://localhost:3306/agendamento_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Endereço do sistema principal (de onde vem clientes, serviços e o login)
faturamento.url=http://localhost:8080
